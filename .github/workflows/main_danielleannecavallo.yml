# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - danielleannecavallo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://mcr.microsoft.com/
        username: ${{ secrets.AzureAppService_ContainerUsername_c4b668da049449ca9c56055c3993dd43 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_d85e65a7c6a74d1d9ae883c973012323 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: mcr.microsoft.com/${{ secrets.AzureAppService_ContainerUsername_c4b668da049449ca9c56055c3993dd43 }}/appsvc/staticsite:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'danielleannecavallo'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_41788303970747aeb0006f9f397aba8b }}
        images: 'mcr.microsoft.com/${{ secrets.AzureAppService_ContainerUsername_c4b668da049449ca9c56055c3993dd43 }}/appsvc/staticsite:${{ github.sha }}'