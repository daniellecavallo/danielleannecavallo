# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - danielleannecavallo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://thecavallocompany.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_97add709c43a412eae2e646c153a4ab3 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_9d1a60ae983a44869513b0b8a0eb4335 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: thecavallocompany.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_97add709c43a412eae2e646c153a4ab3 }}/portfolio:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'danielleannecavallo'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_a51d40b93da34697a91fe90146e1f5d1 }}
        images: 'thecavallocompany.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_97add709c43a412eae2e646c153a4ab3 }}/portfolio:${{ github.sha }}'