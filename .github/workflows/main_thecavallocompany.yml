# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - thecavallocompany

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://thecavallocompany.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_91e60dd0d6c9418baba2c96aa8182a1d }}
        password: ${{ secrets.AzureAppService_ContainerPassword_568edbfeaaad4c70ab9b96201a84e5b6 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: thecavallocompany.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_91e60dd0d6c9418baba2c96aa8182a1d }}/portfolio:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'thecavallocompany'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_c95fe6bad69243beb9c407ff13f5b238 }}
        images: 'thecavallocompany.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_91e60dd0d6c9418baba2c96aa8182a1d }}/portfolio:${{ github.sha }}'